<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;padding:15px;background:#f8fafc}.box{background:#fff;padding:15px;border-radius:12px} input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #cbd5e1}</style></head><body>
<a href="/">← Home</a><div class="box" style="margin-top:10px"><h2>Sell Container - All India Free</h2>
<form method="POST">
<input name="title" placeholder="Container Title Ex: 20ft Dry Good Condition" required>
<input name="city" list="cities" placeholder="City - Ex: Mumbai, Mundra, Chennai" required>
<datalist id="cities"><option>Mumbai - Nhava Sheva</option><option>Mumbai - Bhiwandi</option><option>Mundra</option><option>Kandla</option><option>Chennai</option><option>Delhi - Tughlakabad</option><option>Kolkata</option><option>Hyderabad</option><option>Bangalore</option><option>Pune</option><option>Ahmedabad</option></datalist>
<input name="state" placeholder="State Ex: Maharashtra" required>
<select name="size"><option>20ft</option><option>40ft</option><option>40ft HC</option></select>
<select name="type"><option>Dry</option><option>Reefer</option><option>Open Top</option><option>Flat Rack</option></select>
<input name="price" placeholder="Price in Rs - Ex: 85000" required>
<input name="phone" placeholder="Your WhatsApp Number" required>
<input name="seller" placeholder="Company / Your Name" required>
<button style="width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:10px;margin-top:10px;font-weight:bold">POST FREE - ALL INDIA</button>
</form></div></body></html>
