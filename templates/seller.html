<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif; background:#f2f4f7; margin:0; padding:0;">
<div style="max-width:900px; margin:20px auto; padding:0 15px;">
  <h2 style="margin-bottom:5px;">Add Container</h2>
  <p style="color:#555;">Login: <b>{{my_phone}}</b> | <a href="/my-containers" style="color:#1976d2;">My Containers</a> | <a href="/">Home</a></p>

  <form method="POST" style="background:white; padding:25px 30px; border-radius:14px; box-shadow:0 4px 15px rgba(0,0,0,0.08);">
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
      <div>
        <label style="font-weight:600;">Seller Name*</label><br>
        <input name="seller" required style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
      </div>
      <div>
        <label style="font-weight:600;">Price* (e.g. 300/day)</label><br>
        <input name="price" required style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
      </div>
    </div>

    <div style="margin-top:15px;">
      <label style="font-weight:600;">Container Title* (e.g. 20ft Used Container Mumbai)</label><br>
      <input name="title" required style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:15px; margin-top:15px;">
      <div><label style="font-weight:600;">City*</label><br><input name="city" placeholder="Mumbai" required style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;"></div>
      <div><label style="font-weight:600;">State*</label><br><input name="state" placeholder="Maharashtra" required style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;"></div>
      <div><label style="font-weight:600;">Size*</label><br><select name="size" style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;"><option>20ft</option><option>40ft</option><option>20ft & 40ft Both</option></select></div>
      <div><label style="font-weight:600;">Type*</label><br><select name="type" style="width:100%; padding:12px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;"><option>Rent</option><option>Sell</option><option>Rent & Sell Both</option></select></div>
    </div>

    <button type="submit" style="width:100%; margin-top:25px; padding:14px; background:#0d6efd; color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">Submit Container</button>
  </form>
</div>
</body>
                                                              </html>
