<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;background:#f5f5f5">
<h2>Add Container</h2><p>Login: {{my_phone}} | <a href="/my-containers">My Containers</a></p>
<form method="POST" style="background:white;padding:20px;border-radius:12px;max-width:500px">
Seller Name*<br><input name="seller" required style="width:100%;padding:8px;margin-bottom:10px"><br>
Title* (e.g. 20ft Used Container)<br><input name="title" required style="width:100%;padding:8px;margin-bottom:10px"><br>
City*<br><input name="city" placeholder="Mumbai" required style="width:100%;padding:8px;margin-bottom:10px"><br>
State*<br><input name="state" placeholder="Maharashtra" required style="width:100%;padding:8px;margin-bottom:10px"><br>
Size*<br><select name="size" style="width:100%;padding:8px;margin-bottom:10px"><option>20ft</option><option>40ft</option><option>20ft & 40ft Both</option></select><br>
Type*<br><select name="type" style="width:100%;padding:8px;margin-bottom:10px"><option>Rent</option><option>Sell</option><option>Rent & Sell Both</option></select><br>
Price* (e.g. 300/day)<br><input name="price" required style="width:100%;padding:8px;margin-bottom:15px"><br>
<button type="submit" style="width:100%;padding:12px;background:green;color:white;border:none;border-radius:6px">Submit</button>
</form></body></html>
