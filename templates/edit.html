<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;background:#f5f5f5">
<h2>Edit #{{c['id']}}</h2><a href="/my-containers">Back</a>
<form method="POST" style="background:white;padding:20px;border-radius:12px;max-width:500px;margin-top:15px">
Seller Name<br><input name="seller" value="{{c['seller_name']}}" style="width:100%;padding:8px;margin-bottom:10px"><br>
Title<br><input name="title" value="{{c['title']}}" style="width:100%;padding:8px;margin-bottom:10px"><br>
City<br><input name="city" value="{{c['city']}}" style="width:100%;padding:8px;margin-bottom:10px"><br>
State<br><input name="state" value="{{c['state']}}" style="width:100%;padding:8px;margin-bottom:10px"><br>
Size<br><select name="size" style="width:100%;padding:8px;margin-bottom:10px"><option {% if c['size']=='20ft' %}selected{% endif %}>20ft</option><option {% if c['size']=='40ft' %}selected{% endif %}>40ft</option><option {% if c['size']=='20ft & 40ft Both' %}selected{% endif %}>20ft & 40ft Both</option></select><br>
Type<br><select name="type" style="width:100%;padding:8px;margin-bottom:10px"><option {% if c['type']=='Rent' %}selected{% endif %}>Rent</option><option {% if c['type']=='Sell' %}selected{% endif %}>Sell</option><option {% if c['type']=='Rent & Sell Both' %}selected{% endif %}>Rent & Sell Both</option></select><br>
Price<br><input name="price" value="{{c['price']}}" style="width:100%;padding:8px;margin-bottom:15px"><br>
<button style="width:100%;padding:12px;background:#1976d2;color:white;border:none;border-radius:6px">Update</button>
</form></body></html>
